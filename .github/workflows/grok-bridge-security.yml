name: Grok bridge security tests
on:
  pull_request:
    paths:
      - 'grok_bridge/**'
      - '.github/workflows/grok-bridge-security.yml'
      - 'Makefile'
permissions:
  contents: read
jobs:
  grok-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r grok_bridge/requirements.txt pytest==9.2.0 ruff==0.17.4
      - run: python -m pip install -r grok_bridge/deployment/requirements.txt
      - run: make test-grok lint-grok lint-grok-browser test-grok-release lint-grok-release

  grok-release-host-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install -r grok_bridge/deployment/requirements.txt pytest==9.2.0 ruff==0.17.4
      - run: make test-grok-release lint-grok-release
