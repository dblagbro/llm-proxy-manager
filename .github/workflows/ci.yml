name: CI

# Regression guard for the bug classes that have actually recurred here.
#
# History of this file is a two-year argument with one blocker, now closed:
#
#   2026-08-05  Full suite not CI-ready — a chunk of tests/unit was non-hermetic
#               (session fixtures POSTed to the LIVE deployment with admin
#               creds), so only an app-build smoke + 4 hermetic files gated.
#   2026-08-17  Gating widened 4 -> 8 files, adding the v5.22.x pins — most
#               importantly test_v5226_next_route_terminates.py, the regression
#               pin for the _next_route loop that caused the node wedges and
#               which CI had never run.
#   2026-09-06  Live-fixture half closed: fixtures SKIP unless opted in.
#               What remained was the pre-existing failure list.
#   2026-09-28  (v5.22.38) BOTH halves closed. tests/known_failures.txt is
#               EMPTY, tests/unit is green at 3985 passed, and the suite is
#               provably network-free — verified by running it under a socket
#               guard that raises on any non-loopback connect: zero attempts.
#
# So the full unit suite is now BLOCKING, and the hand-maintained 8-file list is
# gone: it was a strict subset of what now runs anyway, and keeping it would
# just be a second place to forget to update.
#
# The integration suite is blocking too, which it has never been. It no longer
# needs a deployment at all: LLMPROXY_TEST_EPHEMERAL=1 boots a private
# throwaway instance per run (tests/_ephemeral.py). See
# tests/known_integration_failures.txt for the tests that making it runnable
# surfaced — those are a triage list, not a parking space.

# Runner and actions are PINNED deliberately (v5.22.39). `ubuntu-latest` emitted a
# migration notice and the v4/v5 actions emitted a Node.js 20 deprecation warning
# on every job — two annotations per job, on green runs as much as red ones, which
# lands in the operator's failure emails and makes a passing build look broken.
# Bump these on purpose, not by drifting with `latest`.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        # v5.22.38 — frontend/dist is a build artifact and gitignored, so a clean
        # runner has none. app/main.py only registers the SPA catch-all when
        # frontend/dist/index.html exists, which made two route tests fail the
        # first time CI ran the full suite — correctly, for a reason nobody could
        # see. Building here means they actually run, and it catches a broken
        # frontend build as a bonus (previously only discovered at image build).
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: App build smoke (catches import/signature breakage)
        # This alone would have caught the class of bug behind the
        # v5.21.14 leak — a broken dependency signature fails the import.
        run: python -c "import app.main; print('import app.main OK')"

      - name: Full unit suite (blocking)
        # v5.22.38 — was a hand-maintained list of 8 hermetic files, because the
        # rest of tests/unit could not pass on a clean runner. Both reasons are
        # gone: known_failures.txt is empty, the suite is green, and it makes no
        # outbound connections (verified under a socket guard). The old list was
        # a subset of this, so nothing stopped being checked.
        run: pytest tests/unit -q -p no:cacheprovider

      - name: Unit suite must stay hermetic
        # The suite being network-free is load-bearing for the step above, so
        # assert it. Any connect() to a non-loopback address fails the build,
        # which is how the next accidental live fixture gets caught on the PR
        # that adds it instead of months later.
        run: python3 tools/run_unit_suite_hermetic.py

  secrets:
    # v5.22.15 — the repo is PUBLIC. A credential that reaches a commit cannot
    # be un-published; rotation is the only real remedy. This is the last
    # automated gate before that becomes true, and it is deliberately its own
    # job so a failure reads as "secret found", not "tests failed".
    #
    # The local .githooks/pre-commit runs the same scanner, but a hook is
    # opt-in per clone and `--no-verify` skips it, so CI has to re-check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Scan tracked files for credential shapes
        run: python3 tools/secret_scan.py

      - name: Forbidden paths must not be tracked
        # Belt-and-braces for .gitignore: an already-tracked file keeps being
        # tracked no matter what .gitignore says later, so assert on the index.
        run: |
          if git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(pem|p12|pfx|jks|db|sqlite3?|bak|dump)$|(^|/)(data|backups)/|id_rsa|id_ed25519|credentials\.json' | grep -v '\.env\.example$'; then
            echo "::error::credential-bearing paths are tracked in git"
            exit 1
          fi
          echo "no forbidden paths tracked"

  integration-ephemeral:
    # v5.22.38 — the integration suite has never run in CI. It required a live
    # deployment, so on a clean runner it could only fail. It now boots its own
    # private instance (sqlite in a tempdir, no network, admin/admin, deleted at
    # exit), so it runs anywhere.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Integration suite against an ephemeral instance
        env:
          LLMPROXY_TEST_EPHEMERAL: "1"
        # Playwright UI tests need a browser and a built frontend; they are a
        # separate concern and stay out until that is wired. The deselect list
        # is tests/known_integration_failures.txt — read its header before
        # adding to it.
        run: |
          DESELECT=$(grep -vE '^\s*(#|$)' tests/known_integration_failures.txt \
            | sed 's/^/--deselect=/' | tr '\n' ' ')
          pytest -q -p no:cacheprovider tests/integration \
            --ignore=tests/integration/test_playwright_ui.py \
            --ignore=tests/integration/test_v5205_load_detail_button.py \
            --ignore=tests/integration/test_v5210_self_edit_ui_pin.py \
            --ignore=tests/integration/test_v5212_default_refuse_tolerance_ui_pin.py \
            --ignore=tests/integration/test_manual_override_flow.py \
            $DESELECT

      - name: Integration suite must not need the network
        run: python3 tools/check_integration_hermetic.py
