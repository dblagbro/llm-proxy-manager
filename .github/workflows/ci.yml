name: CI

# Regression guard for the bug classes that have actually recurred here.
#
# Scope note (2026-08-05): this runs an app-build smoke + the hermetic
# structural/invariant tests, NOT the full unit suite. The full suite is
# not yet CI-ready — a chunk of tests/unit is non-hermetic (session
# fixtures in tests/conftest.py POST to the LIVE deployment at
# voipguru.org with admin creds), so it can't pass on a clean runner.
# Making the whole suite hermetic + green is tracked in
# tests/known_failures.txt; once that's done, promote the "full-unit"
# step below from informational to blocking.
#
# 2026-08-17: added the hermetic v5.22.x pins to the gating step, most
# importantly test_v5226_next_route_terminates.py. That guards the
# _next_route infinite loop — the actual root cause of the repeated node
# wedges — which until now had a regression pin that CI never ran. Gating
# went from 4 test files to 8.
#
# 2026-09-06 (v5.22.17): the live-fixture half of that blocker is CLOSED.
# tests/conftest.py's session fixtures now SKIP unless LLMPROXY_TEST_LIVE=1,
# so the suite no longer authenticates against production on a clean runner —
# and no longer mutates production when run locally, which it had been doing
# silently. What remains before `full-unit` can become blocking is the
# pre-existing failure list. Verified 2026-09-11: tests/known_failures.txt
# is exactly accurate — 57 listed, 57 actual, and the two sets match item
# for item, so it can be trusted as a baseline. (An earlier note here said
# it had "drifted to 64"; that was wrong. The 64 was a transient regression
# introduced by the v5.22.15 fail-closed change and fixed before commit —
# the file itself never drifted.)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: App build smoke (catches import/signature breakage)
        # This alone would have caught the class of bug behind the
        # v5.21.14 leak — a broken dependency signature fails the import.
        run: python -c "import app.main; print('import app.main OK')"

      - name: Invariant guard tests (hermetic — no network)
        # Only hermetic tests belong here. Verified 2026-08-17 by grepping each
        # file for live-deployment references (voipguru / requests. / httpx.);
        # the v5.22.7 password-reset, v5.22.9 SSO and v5.22.10 login-by-email
        # pins DO hit the live deployment via tests/conftest.py session
        # fixtures, so they are deliberately NOT listed — they pass locally and
        # would fail on a clean runner.
        run: |
          pytest -q -p no:cacheprovider \
            tests/unit/test_v52114_watchdog_dep_order.py \
            tests/unit/test_v5717_disconnect_watchdog.py \
            tests/unit/test_v599_watchdog_coverage_responses_audio_images.py \
            tests/unit/test_v52113_pool_self_heal.py \
            tests/unit/test_v5226_next_route_terminates.py \
            tests/unit/test_v5220_sqlite_pool_no_churn.py \
            tests/unit/test_v5227_litellm_tool_shape.py \
            tests/unit/test_v52211_cluster_sync_email.py \
            tests/unit/test_v52213_client_error_and_output_cap.py \
            tests/unit/test_v52212_no_secrets_in_source.py \
            tests/unit/test_v52215_secret_scan.py \
            tests/unit/test_v52215_cluster_auth_fail_closed.py \
            tests/unit/test_v52215_login_throttle.py \
            tests/unit/test_v52215_watchdog_body_race.py \
            tests/unit/test_v52215_auth_skip_streak.py \
            tests/unit/test_v52215_exposure_hardening.py \
            tests/unit/test_v52216_live_tests_opt_in.py \
            tests/unit/test_v52218_claude_oauth_expiry.py \
            tests/unit/test_v52218_webhook_signing_key.py \
            tests/unit/test_v52218_sweep_hardening.py \
            tests/unit/test_v52219_auth_error_wording.py \
            tests/unit/test_v52220_cot_usage_accounting.py

  secrets:
    # v5.22.15 — the repo is PUBLIC. A credential that reaches a commit cannot
    # be un-published; rotation is the only real remedy. This is the last
    # automated gate before that becomes true, and it is deliberately its own
    # job so a failure reads as "secret found", not "tests failed".
    #
    # The local .githooks/pre-commit runs the same scanner, but a hook is
    # opt-in per clone and `--no-verify` skips it, so CI has to re-check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan tracked files for credential shapes
        run: python3 tools/secret_scan.py

      - name: Forbidden paths must not be tracked
        # Belt-and-braces for .gitignore: an already-tracked file keeps being
        # tracked no matter what .gitignore says later, so assert on the index.
        run: |
          if git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(pem|p12|pfx|jks|db|sqlite3?|bak|dump)$|(^|/)(data|backups)/|id_rsa|id_ed25519|credentials\.json' | grep -v '\.env\.example$'; then
            echo "::error::credential-bearing paths are tracked in git"
            exit 1
          fi
          echo "no forbidden paths tracked"

  full-unit-informational:
    # Runs the whole unit suite for visibility. Currently expected to have
    # pre-existing failures (see tests/known_failures.txt) AND network-
    # fixture errors on a clean runner, so it is NON-BLOCKING for now.
    # Promote to a required check once the suite is hermetic + green.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Full unit suite (informational)
        run: pytest tests/unit -q --tb=no -p no:cacheprovider || true
