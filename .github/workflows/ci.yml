name: CI

# Regression guard for the bug classes that have actually recurred here.
#
# Scope note (2026-08-05): this runs an app-build smoke + the hermetic
# structural/invariant tests, NOT the full unit suite. The full suite is
# not yet CI-ready — a chunk of tests/unit is non-hermetic (session
# fixtures in tests/conftest.py POST to the LIVE deployment at
# voipguru.org with admin creds), so it can't pass on a clean runner.
# Making the whole suite hermetic + green is tracked in
# tests/known_failures.txt; once that's done, promote the "full-unit"
# step below from informational to blocking.
#
# 2026-08-17: added the hermetic v5.22.x pins to the gating step, most
# importantly test_v5226_next_route_terminates.py. That guards the
# _next_route infinite loop — the actual root cause of the repeated node
# wedges — which until now had a regression pin that CI never ran. Gating
# went from 4 test files to 8.
#
# The blocker on gating more is NOT the 75 entries in known_failures.txt;
# it is that tests/conftest.py's session fixtures authenticate against the
# LIVE production deployment. That makes a chunk of the suite unrunnable on
# a clean runner AND means running it locally mutates production state
# (see the CAUTION in docs/test-plan.md). Making those fixtures hermetic is
# the single highest-leverage test-infra change available here.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: App build smoke (catches import/signature breakage)
        # This alone would have caught the class of bug behind the
        # v5.21.14 leak — a broken dependency signature fails the import.
        run: python -c "import app.main; print('import app.main OK')"

      - name: Invariant guard tests (hermetic — no network)
        # Only hermetic tests belong here. Verified 2026-08-17 by grepping each
        # file for live-deployment references (voipguru / requests. / httpx.);
        # the v5.22.7 password-reset, v5.22.9 SSO and v5.22.10 login-by-email
        # pins DO hit the live deployment via tests/conftest.py session
        # fixtures, so they are deliberately NOT listed — they pass locally and
        # would fail on a clean runner.
        run: |
          pytest -q -p no:cacheprovider \
            tests/unit/test_v52114_watchdog_dep_order.py \
            tests/unit/test_v5717_disconnect_watchdog.py \
            tests/unit/test_v599_watchdog_coverage_responses_audio_images.py \
            tests/unit/test_v52113_pool_self_heal.py \
            tests/unit/test_v5226_next_route_terminates.py \
            tests/unit/test_v5220_sqlite_pool_no_churn.py \
            tests/unit/test_v5227_litellm_tool_shape.py \
            tests/unit/test_v52211_cluster_sync_email.py

  full-unit-informational:
    # Runs the whole unit suite for visibility. Currently expected to have
    # pre-existing failures (see tests/known_failures.txt) AND network-
    # fixture errors on a clean runner, so it is NON-BLOCKING for now.
    # Promote to a required check once the suite is hermetic + green.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Full unit suite (informational)
        run: pytest tests/unit -q --tb=no -p no:cacheprovider || true
