name: Gateway offline recovery source tests
on:
  pull_request:
    paths:
      - 'tools/gateway_recovery/**'
      - 'Makefile'
      - '.github/workflows/gateway-offline-recovery.yml'
permissions:
  contents: read
jobs:
  gateway-recovery-source:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.2.0 ruff==0.17.4
      - run: make test-gateway-recovery lint-gateway-recovery GATEWAY_RECOVERY_PYTHON=python
