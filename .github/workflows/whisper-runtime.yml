name: Whisper runtime
on:
  pull_request:
    paths: ['whisper_bridge/**', 'Makefile', '.github/workflows/whisper-runtime.yml']
  push:
    branches: [main]
    paths: ['whisper_bridge/**', 'Makefile', '.github/workflows/whisper-runtime.yml']
permissions:
  contents: read
jobs:
  speech-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install formatter used by the sidecar gate
        run: python -m pip install ruff==0.17.4
      - run: make lint-whisper
      - run: make build-whisper
      - name: Offline synthetic speech and asset checks
        run: make test-whisper
