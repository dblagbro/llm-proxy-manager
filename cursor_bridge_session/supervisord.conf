; cursor-bridge-session supervisord — same shape as grok_bridge.
;
; supervisord runs 4 long-running sidecars in order:
;   Xvfb (display) -> fluxbox (WM) -> x11vnc (5900) -> websockify (6080)
; then start.sh execs the FastAPI app in the foreground as PID 1 so
; docker-stop terminates cleanly.

[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:fluxbox]
command=/usr/bin/fluxbox -display :99
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.err

[program:x11vnc]
; -shared allows operator's noVNC tab to coexist with Playwright's
; X11 attach. -nopw is fine — nginx in front gates with the
; operator's authenticated llm-proxy2 admin session.
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -o /var/log/supervisor/x11vnc.log
autostart=true
autorestart=true
priority=30
startsecs=2
stdout_logfile=/var/log/supervisor/x11vnc.stdout
stderr_logfile=/var/log/supervisor/x11vnc.stderr

[program:websockify]
; Serves /vnc/ via noVNC at 6080 — proxied by FastAPI under /vnc.
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
priority=40
startsecs=2
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.err
