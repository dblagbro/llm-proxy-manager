; supervisord wrangles 4 long-running processes that have to come up in
; order: Xvfb (display) → fluxbox (window manager so the browser has
; chrome-style decorations and the operator sees a real-looking desktop)
; → x11vnc (exposes :99 to localhost:5900) → websockify+noVNC (HTML5
; client at /vnc/) → FastAPI app (which launches Chromium itself once
; the display is live).
;
; We don't run the FastAPI app from supervisord directly — supervisord
; runs xvfb/wm/vnc/websockify, then start.sh execs the Python app in
; the foreground. That keeps the container's PID 1 attached to the app,
; so docker-stop kills it cleanly.
[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac -nolisten tcp
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:fluxbox]
command=/usr/bin/fluxbox -display :99
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.err

[program:x11vnc]
; -shared lets the operator's noVNC session coexist with our FastAPI app's
; Playwright connection (both attach via X11 directly, but x11vnc handles
; concurrent VNC viewers).
; -nopw is fine — the bridge is only reachable behind nginx, which we
; gate to the operator's authenticated llm-proxy2 admin session.
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -o /var/log/supervisor/x11vnc.log
autostart=true
autorestart=true
priority=30
startsecs=2
stdout_logfile=/var/log/supervisor/x11vnc.stdout
stderr_logfile=/var/log/supervisor/x11vnc.stderr

[program:websockify]
; Serves /vnc/ via noVNC at port 6080 — proxied by FastAPI under /vnc.
; --web points at noVNC's static assets (debian package puts them here).
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.err
