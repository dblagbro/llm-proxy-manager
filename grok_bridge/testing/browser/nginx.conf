events {}
http {
    include /etc/nginx/mime.types;
    access_log off;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 ipv6=off valid=10s;
    server {
        listen 443 ssl;
        server_name operator.example.test;
        ssl_certificate /fixture/tls/cert.pem;
        ssl_certificate_key /fixture/tls/key.pem;
        include /fixture/grok-bridge.conf;
        location /llm-proxy2/ {
            proxy_pass http://llm-proxy2:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
