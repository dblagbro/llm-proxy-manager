# Grok bridge browser traffic must reach the bridge authorization layer.
# The outer session check supplies a friendly redirect; the bridge verifies admin.
# Docker DNS resolution is deferred so a stopped bridge cannot break nginx reload.
location = /grok-bridge-auth-check {
    internal;
    set $up_llm_proxy2 llm-proxy2;
    rewrite ^.*$ /api/auth/me break;
    proxy_pass http://$up_llm_proxy2:3000;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
}
location @bridge_unauthorized {
    return 302 /llm-proxy2/?bridge_login_required=1;
}
location = /grok-bridge {
    return 302 /grok-bridge/login;
}
location = /grok-bridge/vnc/websockify {
    auth_request /grok-bridge-auth-check;
    error_page 401 = @bridge_unauthorized;
    set $grok_bridge_host llm-proxy2-grok-bridge;
    proxy_pass http://$grok_bridge_host:8443/vnc/websockify;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
# Existing peer inference uses X-Bridge-Token, not an operator cookie.
location = /grok-bridge/api/chat {
    set $grok_bridge_host llm-proxy2-grok-bridge;
    proxy_pass http://$grok_bridge_host:8443/api/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;
}
location /grok-bridge/ {
    auth_request /grok-bridge-auth-check;
    error_page 401 = @bridge_unauthorized;
    set $grok_bridge_host llm-proxy2-grok-bridge;
    rewrite ^/grok-bridge(/.*)$ $1 break;
    proxy_pass http://$grok_bridge_host:8443;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
